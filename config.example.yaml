scanner:
    targets: "1.1.1.1/32,45.33.32.156/32,64.13.139.230/32"
    ports: "22,23,80,443,8000,8080"
    rate: 1000
    wait: 5

grabber:
    concurrency_limit: 50
    timeout: 3

service_detector:
    enabled: true
    timeout: 30

vulners:
    enabled: false
    api_key: "<vulners_api_key>"
    max_results_per_service: 5

telegram:
    enabled: false
    bot_token: "<bot_token>"
    chat_id: "<chat_id>"

email:
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 587
    use_tls: true
    username: "sender@example.com"
    password: "<app_password>"
    from_email: "sender@example.com"
    to_email: "recipient@example.com"

scheduler:
    interval_minutes: 60
